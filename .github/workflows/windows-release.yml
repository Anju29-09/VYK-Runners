name: Windows Release

# Push a tag like v1.0.0 to build and publish a downloadable release.
# Or run manually from the Actions tab to just get build artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Resolve installer version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v(\d+(\.\d+){0,3})$') { $Matches[1] } else { '1.0.0' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"
          Write-Host "Installer version: $v"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
                           -DestinationPath VYKRunners-Windows-Portable.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.version }} `
            installer\vykrunners.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vykrunners-windows
          path: |
            VYKRunners-Windows-Portable.zip
            installer/Output/VYKRunners-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VYK Runners ${{ github.ref_name }}
          files: |
            VYKRunners-Windows-Portable.zip
            installer/Output/VYKRunners-Setup.exe
          body: |
            ## VYK Runners for Windows

            **[⬇ Download VYKRunners-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/VYKRunners-Setup.exe)**

            ### How to install

            1. Download and open `VYKRunners-Setup.exe`.
            2. Windows will show **"Windows protected your PC"**. Click **More info**,
               then **Run anyway**. This appears because the app is not code-signed —
               it is expected, and the app is safe.
            3. Finish the installer, then launch **VYK Runners** from the Start Menu.

            No administrator rights are needed — it installs for the current user only.

            ### Prefer no installer?

            Download `VYKRunners-Windows-Portable.zip`, extract it anywhere, and run
            `vykrunners_flutter.exe`.

            Requires 64-bit Windows 10 or 11.
